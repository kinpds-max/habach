<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>언론 속 하늘바람교회 | 보도자료</title>
<meta name="description" content="언론에 소개된 하늘바람교회의 지역사회 섬김과 활동을 모았습니다.">
<link rel="canonical" href="https://habach.kr/press.html">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#223c56;background:#f7fafc}
*{box-sizing:border-box}body{margin:0}a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid #e6ebf1;position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:auto;padding:19px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-size:20px;font-weight:850;color:#254967}.back{border:1px solid #dce5ed;border-radius:9px;padding:9px 12px;font-size:14px}
main{max-width:1120px;margin:auto;padding:42px 24px 80px}.eyebrow{font-size:12px;color:#557c9b;letter-spacing:.14em;font-weight:800}
h1{font-size:clamp(26px,4vw,40px);margin:9px 0 12px}.intro{color:#657d91;line-height:1.7;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid #dde7ef;border-radius:16px;overflow:hidden;min-height:275px;box-shadow:0 4px 18px rgba(29,69,104,.045);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 26px rgba(29,69,104,.12)}
.art{background:linear-gradient(130deg,#e8f1f9,#f6fafc);height:115px;display:flex;align-items:center;justify-content:space-between;padding:22px;color:#477394}
.art strong{font-size:20px;color:#245075}.art span{font-size:36px;opacity:.5}
.copy{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.meta{font-size:12px;font-weight:750;color:#718ba0;display:flex;justify-content:space-between;gap:8px}
h2{font-size:17px;line-height:1.48;margin:0;color:#234666;word-break:keep-all}
.desc{font-size:13px;color:#7890a3;line-height:1.55;margin:0}
.open{font-size:13px;font-weight:750;color:#2872aa;margin-top:auto}
.note{margin-top:22px;font-size:13px;color:#71869a}
footer{background:#203f60;color:#e4edf5;padding:25px;text-align:center;font-size:13px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}.bar{padding:15px 18px}main{padding:34px 18px 65px}.art{height:95px}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/">⛪ 하늘바람교회</a><a class="back" href="/">홈페이지로 돌아가기 →</a></div></header>
<main><div class="eyebrow">HANEUL BARAM CHURCH · PRESS</div><h1>언론 속 하늘바람교회</h1><p class="intro">하늘바람교회의 지역사회 섬김과 활동을 소개한 보도자료입니다.<br>날짜가 확인된 기사는 최신순으로, 게시일이 확인되지 않은 기사는 그 뒤에 표시합니다.</p><div id="press-list" class="grid" aria-live="polite"></div><p class="note">기사의 저작권은 각 언론사에 있으며, 카드를 누르면 원문 사이트가 열립니다. 확인되지 않은 게시일과 제목은 임의로 기재하지 않습니다.</p></main>
<footer>© 하늘바람교회 · 언론 속 하늘바람교회</footer>
<script>
(async function(){
 const root=document.getElementById('press-list');
 try{
 const r=await fetch('/assets/church-press.json',{cache:'no-store'});if(!r.ok)throw Error('기사 목록을 불러올 수 없습니다.');
 const items=await r.json();
 items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 for(const it of items){
  const a=document.createElement('a');a.className='card';a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';
  const art=document.createElement('div');art.className='art';
  const brand=document.createElement('strong');brand.textContent=it.source;const mark=document.createElement('span');mark.textContent='▤';mark.setAttribute('aria-hidden','true');art.append(brand,mark);
  const body=document.createElement('div');body.className='copy';
  const meta=document.createElement('div');meta.className='meta';const date=document.createElement('span');date.textContent=it.date?it.date.replaceAll('-','.'):'날짜 확인 중';meta.append(date);
  const title=document.createElement('h2');title.textContent=it.title;
  const desc=document.createElement('p');desc.className='desc';desc.textContent=it.summary||'';
  const more=document.createElement('span');more.className='open';more.textContent='기사 원문 보기 ↗';
  body.append(meta,title,desc,more);a.append(art,body);root.append(a);
 }
 }catch(e){root.textContent='보도자료 목록을 불러오지 못했습니다.';console.warn(e);}
})();
</script>
</body></html>
