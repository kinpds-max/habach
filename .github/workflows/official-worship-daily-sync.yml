name: Daily official worship sync to habachnew

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-worship-sync-habachnew
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website production source
        uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playlist reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Sync completed official videos
        run: python scripts/fetch_official_video_albums.py
      - name: Validate outputs
        run: |
          python -m json.tool assets/official-video-albums.json >/dev/null
          test -s index.html
          git diff --check
      - name: Commit verified changes to habachnew
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/official-video-albums.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync completed official worship videos"
            git push origin HEAD:habachnew
          fi
