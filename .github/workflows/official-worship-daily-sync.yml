name: Daily official worship video sync

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-worship-sync-habachnew
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/habachnew'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube playlist reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Fetch public official recordings and update homepage
        run: python scripts/fetch_official_video_albums.py
      - name: Check generated files
        run: |
          python -m json.tool assets/official-video-albums.json >/dev/null
          test -s index.html
          git diff --check
      - name: Commit and push only updated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/official-video-albums.json index.html
          if git diff --cached --quiet; then
            echo "No newly verified videos; no commit needed."
          else
            git commit -m "Sync official worship videos and homepage"
            git push origin HEAD:habachnew
          fi
