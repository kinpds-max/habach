name: Daily dawn worship sync (09:00 KST)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: habach-dawn-daily-sync
  cancel-in-progress: false
jobs:
  sync-dawn:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: habachnew
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install YouTube metadata reader
        run: python -m pip install 'yt-dlp>=2026.10.1'
      - name: Fetch official videos and update Korean dawn titles
        run: python scripts/fetch_official_video_albums.py
      - name: Commit and push only when videos change
        run: |
          if git diff --quiet -- assets/official-video-albums.json; then
            echo 'No new videos; keeping previous verified album.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/official-video-albums.json
          git commit -m 'Sync latest official dawn worship videos (09:00 KST)'
          git pull --rebase origin habachnew
          git push origin HEAD:habachnew
          echo 'Committed newest dawn worship data to the production branch.'
