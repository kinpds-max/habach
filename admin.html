<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하늘바람교회 | 관리자</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.min.js"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#283d52;font-family:Arial,'Malgun Gothic',sans-serif}header{background:white;border-bottom:1px solid #e1e7ed;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1020px;margin:36px auto;padding:0 18px}.card{background:white;border:1px solid #dfe6ef;border-radius:12px;padding:24px;margin-bottom:20px}h1{font-size:24px}label{display:block;font-weight:600;font-size:14px;margin:14px 0 7px}input,select,textarea{width:100%;font-size:15px;border:1px solid #cbd5e0;border-radius:8px;padding:11px;background:white}textarea{min-height:180px;resize:vertical}button{border:0;border-radius:8px;background:#426a92;color:white;padding:12px 22px;cursor:pointer;margin:8px 6px 4px 0}button.secondary{background:#dce5ed;color:#28445d}button.danger{background:#ae3e4b}.post{padding:14px;border-bottom:1px solid #e1e7ed;display:flex;gap:8px;justify-content:space-between;align-items:center}small{color:#718498}#msg{white-space:pre-wrap;color:#9b4242}#workspace{display:none}#login{max-width:480px}</style></head><body><header><strong>하늘바람교회 · 게시판 관리자</strong><a href="index.html">홈페이지로 이동</a></header><main><section class="card" id="login"><h1>관리자 로그인</h1><p>Supabase 인증 계정 및 교회 관리자 권한이 필요합니다.</p><label>이메일</label><input id="email" type="email" autocomplete="email"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><button id="signin">로그인</button><p id="loginmsg"></p></section><section id="workspace"><div class="card"><h1>게시글 관리</h1><button id="signout" class="secondary">로그아웃</button><p id="msg"></p><input type="hidden" id="pid"><label>상세 메뉴별 게시판</label><select id="section_key"><option value="about-1">인사말 (about-1)</option><option value="about-2">교회비전 (about-2)</option><option value="about-3">교회연혁 (about-3)</option><option value="about-4">섬기는 사람들 (about-4)</option><option value="about-5">예배시간 안내 (about-5)</option><option value="about-6">오시는 길 (about-6)</option><option value="sermon-1">주일설교 (sermon-1)</option><option value="sermon-2">수요말씀 (sermon-2)</option><option value="sermon-3">특별집회 (sermon-3)</option><option value="sermon-4">찬양영상 (sermon-4)</option><option value="sermon-5">말씀나눔 (sermon-5)</option><option value="ministry-1">주일예배 (ministry-1)</option><option value="ministry-2">기도회 (ministry-2)</option><option value="ministry-3">새가족 안내 (ministry-3)</option><option value="ministry-4">전도·선교 (ministry-4)</option><option value="ministry-5">봉사와 섬김 (ministry-5)</option><option value="next-1">유치부 (next-1)</option><option value="next-2">아동부 (next-2)</option><option value="next-3">청소년부 (next-3)</option><option value="next-4">청년부 (next-4)</option><option value="next-5">교육자료 (next-5)</option><option value="news-1">공지사항 (news-1)</option><option value="news-2">주보 (news-2)</option><option value="news-3">교회행사 (news-3)</option><option value="news-4">행사사진 (news-4)</option><option value="news-5">교우소식 (news-5)</option><option value="resources-1">사진앨범 (resources-1)</option><option value="resources-2">영상자료 (resources-2)</option><option value="resources-3">신앙자료 (resources-3)</option><option value="resources-4">자주 묻는 질문 (resources-4)</option></select><input type="hidden" id="category" value="notice"><label>제목</label><input id="title"><label>내용</label><textarea id="body"></textarea><label>유튜브 주소 (선택)</label><input id="youtube" placeholder="https://www.youtube.com/watch?v=..."><label>게시일 (선택)</label><input id="published_at" type="datetime-local"><label><input type="checkbox" id="published" checked style="width:auto"> 공개 게시</label><button id="save">등록 / 수정</button><button class="secondary" id="reset">새 글 작성</button></div><section class="card"><h2>등록된 글</h2><div id="posts">불러오는 중...</div></section></section></main><script>
const boardCategory={"about":"notice","sermon":"sermon","ministry":"event","next":"resource","news":"notice","resources":"resource"};const cfg=window.HABACH_CONFIG||{},$=id=>document.getElementById(id);let sb=null,rows=[];const escapeHtml=t=>String(t||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
if(cfg.supabaseUrl&&cfg.supabasePublishableKey&&window.supabase)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);else $('loginmsg').textContent='config.js에 Supabase URL / publishable key를 연결해야 합니다.';
function videoId(url){if(!url)return null;try{const u=new URL(url);if(['youtu.be','www.youtu.be'].includes(u.hostname))return u.pathname.split('/')[1]||null;if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/live/')||u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]||null}}catch{}return null}
async function authorized(){if(!sb)return;const {data:{user}}=await sb.auth.getUser();if(!user){$('login').style.display='block';$('workspace').style.display='none';return;}const r=await sb.from('church_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(r.error||!r.data){$('loginmsg').textContent='인증됐지만 교회 관리자 권한이 없습니다.';$('workspace').style.display='none';return;}$('login').style.display='none';$('workspace').style.display='block';await load();}
$('signin').onclick=async()=>{if(!sb)return;const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginmsg').textContent=error?error.message:'';if(!error)await authorized()};$('signout').onclick=async()=>{await sb?.auth.signOut();location.reload()};
async function load(){const r=await sb.from('church_posts').select('*').order('created_at',{ascending:false}).limit(150);if(r.error){$('msg').textContent=r.error.message;return;}rows=r.data||[];$('posts').innerHTML=rows.map(p=>'<div class="post"><span><strong>'+escapeHtml(p.title)+'</strong><br><small>'+escapeHtml(p.section_key||p.category)+' · '+escapeHtml((p.created_at||'').slice(0,10))+'</small></span><span><button class="secondary" data-edit="'+p.id+'">수정</button><button class="danger" data-delete="'+p.id+'">삭제</button></span></div>').join('')||'등록된 게시글 없음';$('posts').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let p=rows.find(x=>x.id===b.dataset.edit);$('pid').value=p.id;$('section_key').value=p.section_key||'news-1';$('category').value=p.category;$('title').value=p.title;$('body').value=p.body||'';$('youtube').value=p.youtube_id?'https://youtu.be/'+p.youtube_id:'';$('published').checked=p.published;$('published_at').value=p.published_at?.slice(0,16)||'';window.scrollTo({top:0,behavior:'smooth'})});$('posts').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('이 게시글을 삭제하시겠습니까?'))return;const {error}=await sb.from('church_posts').delete().eq('id',b.dataset.delete);$('msg').textContent=error?.message||'삭제되었습니다';await load()})}
$('save').onclick=async()=>{if(!sb)return;let youtube=$('youtube').value.trim(),id=videoId(youtube);if(youtube&&!id){$('msg').textContent='올바른 YouTube 주소가 아닙니다';return;}if(!$('title').value.trim()){$('msg').textContent='제목을 입력하세요';return;}let row={section_key:$('section_key').value,category:boardCategory[$('section_key').value.split('-')[0]]||'notice',title:$('title').value.trim(),body:$('body').value,youtube_id:id,thumbnail_url:id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':null,published:$('published').checked,published_at:$('published_at').value?new Date($('published_at').value).toISOString():new Date().toISOString()};let pid=$('pid').value;const r=pid?await sb.from('church_posts').update(row).eq('id',pid):await sb.from('church_posts').insert(row);$('msg').textContent=r.error?.message||'저장되었습니다';if(!r.error){$('reset').click();await load()}};
$('reset').onclick=()=>{['pid','title','body','youtube','published_at'].forEach(x=>$(x).value='');$('section_key').value='about-1';$('category').value='notice';$('published').checked=true};authorized();</script></body></html>
