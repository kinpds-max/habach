name: Adjust small-group video ratio and sorting
on:
  push:
    branches: [habachnew]
    paths:
      - '.github/workflows/habach-layout-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - name: Patch index without replacing original content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = 'data-habach-group-layout-v1'
          if marker in s:
              print("Already applied")
              raise SystemExit(0)
          addition = r"""
          <script data-habach-group-layout-v1>
          (() => {
            const targets = /(?:2\s*[.·ㆍ]?\s*3\s*[.·ㆍ]?\s*4\s*(?:스몰|소그룹)|스몰모임|형제들의\s*모임|남자들의\s*모임|자매들의\s*모임)/;
            const is234 = /(?:2\s*[.·ㆍ]?\s*3\s*[.·ㆍ]?\s*4|스몰모임)/;
            const seen = new WeakSet();
            function resizeAndSort() {
              const all = [...document.querySelectorAll('h1,h2,h3,h4,h5,h6,.section-title,.page-title,.board-title,.album-title,.tab-title')];
              for (const heading of all) {
                const title = (heading.textContent||'').trim();
                if (!targets.test(title)) continue;
                let section = heading.closest('section,article,[class*="page"],[class*="section"],[class*="board"],[class*="album"]') || heading.parentElement?.parentElement;
                if (!section) continue;
                const media = section.querySelectorAll('iframe[src*="youtu"],video,[class*="thumb"],[class*="video-thumb"],[class*="reel"],[class*="short"]');
                media.forEach(el => {
                  const box = el.closest('[class*="thumbnail"],[class*="thumb"],[class*="video-item"],[class*="reel"],[class*="short"]') || el;
                  box.style.setProperty('aspect-ratio','4 / 3','important');
                  box.style.setProperty('height','auto','important');
                  if (box !== el && (el.tagName === 'VIDEO'||el.tagName === 'IFRAME')) {
                    el.style.setProperty('width','100%','important');
                    el.style.setProperty('height','100%','important');
                  }
                  if (el.tagName === 'IMG' || el.tagName === 'VIDEO') el.style.setProperty('object-fit','contain','important');
                });
                if (!is234.test(title)) continue;
                const containers = section.querySelectorAll('[class*="grid"],[class*="list"],[class*="album"],[class*="cards"]');
                for (const box of containers) {
                  if (seen.has(box)) continue;
                  const children = [...box.children];
                  if (children.length < 2 || children.length > 100) continue;
                  if (!children.every(el => el.querySelector('img,iframe,video') || el.matches('[class*="item"],[class*="card"]'))) continue;
                  const label = el => (el.querySelector('h3,h4,h5,[class*="title"]')?.textContent || el.textContent || '').replace(/\s+/g,' ').trim();
                  if (children.some(el => !label(el))) continue;
                  const sorted = [...children].sort((a,b) => label(a).localeCompare(label(b),'ko'));
                  sorted.forEach(el => box.appendChild(el));
                  seen.add(box);
                  break;
                }
              }
            }
            let queued=false;
            function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;resizeAndSort()})}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
          if "</body>" not in s:
              raise SystemExit("Cannot find </body>; no change")
          p.write_text(s.replace("</body>",addition+"\n</body>",1),encoding="utf-8")
          print("Patched",len(s),"->",p.stat().st_size)
          PY
      - name: Fix community heading and alphabetical small group cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='data-habach-community-tidy-v2'
          if marker not in s:
              script=r"""
          <script data-habach-community-tidy-v2>
          (() => {
            const ko=(a,b)=>a.localeCompare(b,'ko');
            function fix(){
              const headings=[...document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,div,span,strong')];
              for(const el of headings){
                if(el.children.length && [...el.children].some(c=>c.tagName && ['DIV','P','H1','H2','H3','H4','H5','H6'].includes(c.tagName)))continue;
                const t=(el.textContent||'').trim().replace(/\s+/g,' ');
                if(t.includes('함께 모여 말씀과 삶을 나누는 하늘바람교회') && t.length<130 && !el.dataset.communityFixed){
                  el.dataset.communityFixed='1';
                  el.textContent=t.replace(/(나누는)\s*(하늘바람교회)/,'$1\n$2');
                  el.style.whiteSpace='pre-line';
                }
                if(/2026년\s*2\s*[.·ㆍ]\s*3\s*[.·ㆍ]\s*4\s*스몰모임\s*앨범/.test(t) && t.length<55){
                  el.style.display='none';
                  el.setAttribute('aria-hidden','true');
                }
              }
              const cards=[...document.querySelectorAll('h2,h3,h4,h5,strong')].filter(x=>/사믿순\s*[·ㆍ]\s*파키스탄|말레이순/.test(x.textContent||''));
              for(const cardTitle of cards){
                let card=cardTitle;
                while(card.parentElement && card.parentElement.children.length<2)card=card.parentElement;
                let parent=card.parentElement;
                if(!parent)continue;
                let items=[...parent.children].filter(x=>x.querySelector('img') && (x.textContent||'').trim());
                if(items.length<2 || items.length>60)continue;
                const name=x=>(x.querySelector('h3,h4,h5,strong,[class*="title"]')?.textContent||x.textContent||'').replace(/\s+/g,' ').trim();
                const sorted=items.slice().sort((a,b)=>ko(name(a),name(b)));
                if(items.some((x,i)=>x!==sorted[i]))sorted.forEach(x=>parent.appendChild(x));
                break;
              }
            }
            let busy=false;
            const schedule=()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{busy=false;fix()})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
              if '</body>' not in s: raise SystemExit('No closing body')
              p.write_text(s.replace('</body>',script+'\n</body>',1),encoding='utf-8')
          PY
      - name: Include youth gathering videos in 4 by 3 layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='data-habach-youth-video-4x3-v1'
          if marker not in s:
              script=r"""
          <script data-habach-youth-video-4x3-v1>
          (() => {
            const youth=/청년들의\s*모임/;
            function apply(){
              for(const h of document.querySelectorAll('h1,h2,h3,h4,h5,h6,.section-title,.page-title,.board-title,.album-title,.tab-title')){
                if(!youth.test(h.textContent||''))continue;
                const section=h.closest('section,article,[class*="page"],[class*="section"],[class*="board"],[class*="album"]')||h.parentElement?.parentElement;
                if(!section)continue;
                section.querySelectorAll('iframe[src*="youtu"],video,[class*="thumb"],[class*="video-thumb"],[class*="reel"],[class*="short"]').forEach(el=>{
                  const box=el.closest('[class*="thumbnail"],[class*="thumb"],[class*="video-item"],[class*="reel"],[class*="short"]')||el;
                  box.style.setProperty('aspect-ratio','4 / 3','important');
                  box.style.setProperty('height','auto','important');
                  if(box!==el&&(el.tagName==='IFRAME'||el.tagName==='VIDEO')){
                    el.style.setProperty('width','100%','important');
                    el.style.setProperty('height','100%','important');
                  }
                  if(el.tagName==='IMG'||el.tagName==='VIDEO')el.style.setProperty('object-fit','contain','important');
                });
              }
            }
            let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;apply()})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('Missing body close')
              p.write_text(s.replace('</body>',script+'\n</body>',1),encoding='utf-8')
          PY
      - name: Format small group meeting schedule boxes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='data-habach-smallgroup-schedule-v1'
          if marker not in s:
              snippet=r"""
          <style data-habach-smallgroup-schedule-v1>
          .habach-smallgroup-schedule{background:#f4f8fc;border:1px solid #dce7ef;border-radius:14px;padding:19px 20px;margin:20px 0 28px;display:grid;gap:13px;color:#405568}
          .habach-smallgroup-schedule-row{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:start;gap:16px;font-size:16px;line-height:1.65}
          .habach-smallgroup-schedule-row strong{color:#176083;font-weight:800}
          @media(max-width:480px){.habach-smallgroup-schedule{padding:17px 15px}.habach-smallgroup-schedule-row{grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:15px}}
          </style>
          <script data-habach-smallgroup-schedule-v1>
          (() => {
            function apply(){
              for(const heading of document.querySelectorAll('h1,h2,h3,h4,h5,h6')){
                const title=(heading.textContent||'').replace(/\s+/g,' ').trim();
                if(!/소그룹\s*교제|2\s*[.·ㆍ]\s*3\s*[.·ㆍ]\s*4\s*스몰모임/.test(title))continue;
                let section=heading.closest('section,article,[class*="page"],[class*="section"]')||heading.parentElement?.parentElement;
                if(!section)continue;
                for(const el of section.querySelectorAll('p,div,li')){
                  if(el.classList.contains('habach-smallgroup-schedule')||el.closest('.habach-smallgroup-schedule'))continue;
                  if(el.children.length>4)continue;
                  const content=(el.textContent||'').replace(/\s+/g,' ').trim();
                  if(content.length>250||content.length<15)continue;
                  if(!(/모임\s*시간|모임시간|예배시간/.test(content)&&/장소/.test(content)))continue;
                  if(el.querySelector('iframe,video,img,button'))continue;
                  const lines=content.split(/(?=모임\s*시간\s*[:：]?|예배\s*시간\s*[:：]?|장소\s*[:：]?|담당\s*[:：]?|안내\s*[:：]?)/).map(x=>x.trim()).filter(Boolean);
                  if(lines.length<2||lines.length>8)continue;
                  const box=document.createElement('div');box.className='habach-smallgroup-schedule';
                  for(const line of lines){
                    const m=line.match(/^(모임\s*시간|예배\s*시간|장소|담당|안내)\s*[:：]?\s*(.*)$/);
                    if(!m)continue;
                    const row=document.createElement('div');row.className='habach-smallgroup-schedule-row';
                    const label=document.createElement('strong');label.textContent=m[1].replace(/\s+/g,'');
                    const value=document.createElement('span');value.textContent=m[2];
                    row.append(label,value);box.append(row);
                  }
                  if(box.children.length>=2){el.replaceWith(box);break}
                }
              }
            }
            let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;apply()})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('No body tag')
              p.write_text(s.replace('</body>',snippet+'\n</body>',1),encoding='utf-8')
          PY
      - name: Replace small group notice with structured schedule box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='data-habach-smallgroup-schedule-v2'
          if marker not in s:
              snippet=r"""
          <style data-habach-smallgroup-schedule-v2>
          .habach-group-info-box{background:#f3f8fd;border:1px solid #dce7ef;border-radius:16px;padding:19px 20px;margin:24px 0 32px;display:grid;gap:13px}
          .habach-group-info-row{display:grid;grid-template-columns:106px minmax(0,1fr);gap:14px;align-items:start;line-height:1.7;font-size:16px;color:#435163}
          .habach-group-info-row b{color:#126084;font-weight:800}
          @media(max-width:600px){.habach-group-info-box{padding:16px 17px}.habach-group-info-row{grid-template-columns:88px minmax(0,1fr);gap:10px;font-size:15px}}
          </style>
          <script data-habach-smallgroup-schedule-v2>
          (() => {
            const target=/2\s*[.·ㆍ]\s*3\s*[.·ㆍ]\s*4\s*스몰모임\s*안내\s*[:：]?\s*주일\s*2부\s*예배\s*마치고/;
            function apply(){
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              const hits=[];
              while(walker.nextNode()){
                const node=walker.currentNode;
                if(node.parentElement?.closest('.habach-group-info-box,script,style'))continue;
                if(target.test((node.nodeValue||'').replace(/\s+/g,' ')))hits.push(node);
              }
              for(const node of hits){
                const el=node.parentElement;
                if(!el||el.querySelector('img,video,iframe'))continue;
                const text=(el.textContent||'').replace(/\s+/g,' ').trim();
                if(text.length>180 || !target.test(text))continue;
                const box=document.createElement('div');
                box.className='habach-group-info-box';
                function add(k,v){const row=document.createElement('div');row.className='habach-group-info-row';const label=document.createElement('b');label.textContent=k;const value=document.createElement('span');value.textContent=v;row.append(label,value);box.append(row)}
                add('모임시간','주일 2부예배 마치고');
                el.replaceWith(box);
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
            const observer=new MutationObserver(()=>{observer.disconnect();apply();observer.observe(document.body,{subtree:true,childList:true})});
            observer.observe(document.body,{subtree:true,childList:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('body close not found')
              p.write_text(s.replace('</body>',snippet+'\n</body>',1),encoding='utf-8')
          PY
      - name: Format every gathering's notice as info card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          marker='data-habach-all-gathering-info-v3'
          if marker not in s:
              code=r"""
          <style data-habach-all-gathering-info-v3>
          .habach-meeting-information{background:#f3f8fd;border:1px solid #dce7ef;border-radius:16px;padding:19px 20px;margin:24px 0 32px;display:grid;gap:14px}
          .habach-meeting-information-line{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;line-height:1.65;font-size:16px;color:#435163}
          .habach-meeting-information-line strong{color:#146184;font-weight:800}
          @media(max-width:600px){.habach-meeting-information{padding:16px}.habach-meeting-information-line{grid-template-columns:84px minmax(0,1fr);gap:10px;font-size:15px}}
          </style>
          <script data-habach-all-gathering-info-v3>
          (() => {
            const records=[
              {name:/남자들의\s*모임|형제들의\s*모임/,value:'매달 셋째 주 금요철야 후'},
              {name:/자매들의\s*모임/,value:'매주 화요일 오전 10시'},
              {name:/청년들의\s*모임/,value:'별도 안내'},
              {name:/2\s*[.·ㆍ]\s*3\s*[.·ㆍ]\s*4\s*스몰모임/,value:'주일 2부예배 마치고'}
            ];
            function run(){
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              const nodes=[];
              while(walker.nextNode()){
                const n=walker.currentNode;
                if(n.parentElement?.closest('script,style,.habach-meeting-information,.habach-group-info-box,.habach-smallgroup-schedule'))continue;
                const t=(n.nodeValue||'').replace(/\s+/g,' ').trim();
                if(t.length>12 && t.length<160 && records.some(r=>r.name.test(t)&&t.includes('안내')))nodes.push(n);
              }
              for(const n of nodes){
                const t=(n.nodeValue||'').replace(/\s+/g,' ').trim();
                const rec=records.find(r=>r.name.test(t)&&t.includes('안내'));
                if(!rec)continue;
                const match=t.match(/안내\s*[:：]\s*(.*)$/);
                if(!match)continue;
                let el=n.parentElement;
                if(!el||el.closest('.habach-meeting-information'))continue;
                if(el.children.length>0 && (el.querySelector('a,button,img,iframe,video')||el.textContent.length>200))continue;
                const card=document.createElement('div');card.className='habach-meeting-information';
                const row=document.createElement('div');row.className='habach-meeting-information-line';
                const label=document.createElement('strong');label.textContent='모임시간';
                const val=document.createElement('span');val.textContent=match[1]||rec.value;
                row.append(label,val);card.append(row);
                el.replaceWith(card);
              }
            }
            let pending=false;
            const schedule=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;run()})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{subtree:true,childList:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('missing body')
              p.write_text(s.replace('</body>',code+'\n</body>',1),encoding='utf-8')
          PY
      - name: Enable approved education and community boards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html');s=path.read_text(encoding='utf-8')
          tag='<script defer src="/assets/moderated-boards.js"></script>'
          if tag not in s:
              assert '</body>' in s
              path.write_text(s.replace('</body>',tag+'\n</body>',1),encoding='utf-8')
          PY
      - name: Remove duplicate Friday sermon cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          marker='data-habach-sermon-dedupe-v1'
          if marker not in s:
              code=r"""
          <script data-habach-sermon-dedupe-v1>
          (() => {
            const norm=t=>(t||'').replace(/\s+/g,' ').replace(/^\[금요설교\]\s*/,'').trim().toLocaleLowerCase('ko');
            function dedupe(){
              for(const h of document.querySelectorAll('h1,h2,h3,h4,h5')){
                if(!/금요설교\s*영상\s*앨범/.test(h.textContent||''))continue;
                const root=h.closest('section,article,[class*="section"],[class*="album"]')||h.parentElement?.parentElement;
                if(!root)continue;
                const cards=[...root.querySelectorAll('article,[class*="video-card"],[class*="album-card"],[class*="video-item"],[class*="album-item"]')].filter(c=>c.querySelector('img,iframe,video'));
                const seen=new Set();
                for(const c of cards){
                  const title=c.querySelector('h3,h4,h5,[class*="title"]')?.textContent;
                  if(!title)continue;
                  const key=norm(title);
                  if(!key)continue;
                  if(seen.has(key))c.remove();else seen.add(key);
                }
              }
            }
            let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;dedupe()})};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('No body')
              p.write_text(s.replace('</body>',code+'\n</body>',1),encoding='utf-8')
          PY
      - name: Make dawn sermon home card show dawn worship only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          marker='data-habach-dawn-home-filter-v1'
          if marker not in s:
              script=r"""
          <script data-habach-dawn-home-filter-v1>
          (() => {
            const isDawn=t=>/새벽(?:예배|기도|설교)|새벽기도회/.test(t||'')&&!/금요|금요일|금요강청|금요강청기도회/.test(t||'');
            function fix(){
              const heads=[...document.querySelectorAll('h1,h2,h3,h4,h5')];
              for(const head of heads){
                if(!/새벽설교|새벽예배/.test(head.textContent||''))continue;
                let section=head.closest('section,article,[class*="video-section"],[class*="home-video"]')||head.parentElement?.parentElement;
                if(!section)continue;
                const cards=[...section.querySelectorAll('article,[class*="video-card"],[class*="album-card"],[class*="video-item"]')];
                const shown=cards.filter(c=>c.querySelector('img,iframe,video'));
                if(!shown.length)continue;
                const candidate=shown.find(c=>isDawn(c.textContent));
                if(candidate){
                  const primary=shown[0];
                  if(primary!==candidate){
                    const firstAnchor=primary.parentElement;
                    firstAnchor?.insertBefore(candidate,primary);
                  }
                }
                shown.forEach(c=>{
                  const title=(c.textContent||'').trim();
                  if(/금요|금요일|금요강청/.test(title))c.style.setProperty('display','none','important');
                });
              }
            }
            let scheduled=false;
            function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;fix()})}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{subtree:true,childList:true});
          })();
          </script>
          """
              if '</body>' not in s:raise SystemExit('Missing closing body')
              p.write_text(s.replace('</body>',script+'\n</body>',1),encoding='utf-8')
          PY
      - name: Pin supplied dawn worship video on homepage
        run: |
