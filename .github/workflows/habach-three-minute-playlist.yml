name: Update 3-minute sermon playlist
on:
  workflow_dispatch:
  push:
    branches: [habachnew]
    paths:
      - 'scripts/fetch_three_minute_playlist.py'
      - '.github/workflows/habach-three-minute-playlist.yml'
  schedule:
    - cron: '5 0 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade yt-dlp
      - run: python scripts/fetch_three_minute_playlist.py
      - name: Commit playlist if updated
        run: |
          if git diff --quiet -- assets/three-minute-sermon-videos.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/three-minute-sermon-videos.json
          git commit -m "Sync 3-minute sermon playlist [skip ci]"
          git push origin HEAD:habachnew
