name: Sync official Naver blog posts to production
on:
  schedule:
    - cron: '15 0 * * *' # 09:15 KST
    - cron: '15 6 * * *' # 15:15 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-naver-blog-sync.yml'
permissions:
  contents: write
concurrency:
  group: official-naver-blog-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate blog sync script
        run: python -m py_compile scripts/sync_habach_blog.py
      - name: Refresh official RSS feed
        run: python scripts/sync_habach_blog.py
      - name: Verify preview data
        run: |
          python -m json.tool assets/habach-naver-blog.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/habach-naver-blog.json').read_text())
          assert data['posts'] and all(p['url'].startswith('https://blog.naver.com/habachurch/') for p in data['posts'])
          print('Verified blog posts:',len(data['posts']))
          PY
      - name: Commit latest posts to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/habach-naver-blog.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync official Naver blog preview"
            git push origin HEAD:habachnew
          fi
