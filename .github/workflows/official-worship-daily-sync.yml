name: Daily official worship video sync

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [habachnew]
    paths:
      - 'scripts/fetch_official_video_albums.py'
      - 'scripts/sync_video_albums.py'
      - 'assets/official-video-albums.json'
      - '.github/workflows/official-worship-daily-sync.yml'

permissions:
  contents: write

concurrency:
  group: official-worship-sync-habachnew
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/habachnew'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: habachnew
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube playlist reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Validate Python scripts
        run: python -m py_compile scripts/fetch_official_video_albums.py scripts/sync_video_albums.py
      - name: Fetch public official recordings and update homepage
        run: python scripts/fetch_official_video_albums.py
      - name: Check generated files
        run: |
          python -m json.tool assets/official-video-albums.json >/dev/null
          test -s index.html
          git diff --check
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('assets/official-video-albums.json').read_text())
          html=Path('index.html').read_text()
          match=re.search(r'const views\s*=\s*(\{[\s\S]*?\})(;)',html)
          if not match: raise SystemExit('Home views JSON missing')
          home=json.loads(match.group(1)).get('index','')
          for key in ('sermon-1','sermon-8','friday-evening'):
              videos=data.get(key) or []
              if not videos: raise SystemExit(f'Missing {key} video data')
              latest=videos[0]['id']
              section = 'sermon-7' if key == 'friday-evening' else key
              label=f'href="#/{section}"'
              i=home.find(label)
              if i < 0 or f'data-video="{latest}"' not in home[i:i+1100]:
                  raise SystemExit(f'{key} latest video {latest} missing from home card')
          print('Sunday, dawn and Friday videos present in generated homepage')
          PY
      - name: Commit and push only updated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/official-video-albums.json index.html
          if git diff --cached --quiet; then
            echo "No newly verified videos; no commit needed."
          else
            git commit -m "Sync official worship videos and homepage"
            git push origin HEAD:habachnew
          fi
