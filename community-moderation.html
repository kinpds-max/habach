<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하늘바람교회 게시글 승인 관리</title><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f3f7fa;margin:0;color:#263d51}main{max-width:950px;margin:40px auto;padding:20px}h1{font-size:25px}section{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 2px 12px #0001}input,button,select{padding:11px;border:1px solid #ced9e2;border-radius:8px;margin:4px}button{cursor:pointer}button.approve{background:#16724f;color:white}button.reject{background:#ac3333;color:white}article{border-top:1px solid #ddd;padding:16px 0}pre{white-space:pre-wrap;font-family:inherit}small{color:#677}#error{color:#ac3333}</style></head><body><main><h1>하늘바람교회 게시글 승인 관리</h1><section id="login"><h2>관리자 로그인</h2><form><input name="email" type="email" placeholder="관리자 이메일" required><input name="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><p id="error"></p></section><section id="dashboard" hidden><button id="refresh">목록 새로고침</button><button id="logout">로그아웃</button><h2>승인 대기 게시글</h2><div id="posts">조회 중...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script>
const cfg=window.HABACH_CONFIG,db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const login=document.getElementById('login'),dash=document.getElementById('dashboard'),posts=document.getElementById('posts'),error=document.getElementById('error');
async function verify(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data}=await db.from('church_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}
async function render(){const ok=await verify();login.hidden=ok;dash.hidden=!ok;if(!ok){posts.textContent='관리자 권한이 없습니다.';return}const {data,error:e}=await db.from('church_community_submissions').select('id,section_key,author_name,title,body,status,created_at').eq('status','pending').order('created_at',{ascending:false}).limit(100);posts.replaceChildren();if(e){posts.textContent=e.message;return}if(!data.length){posts.textContent='승인 대기 글이 없습니다.';return}for(const row of data){const el=document.createElement('article');const title=document.createElement('h3');title.textContent=row.title;const small=document.createElement('small');small.textContent=row.section_key+' | '+row.author_name+' | '+new Date(row.created_at).toLocaleString('ko-KR');const body=document.createElement('pre');body.textContent=row.body;const approve=document.createElement('button');approve.className='approve';approve.textContent='승인하고 공개';const reject=document.createElement('button');reject.className='reject';reject.textContent='거절(비공개)';async function action(status){if(!confirm(status==='approved'?'이 글을 공개할까요?':'이 글을 비공개 거절 처리할까요?'))return;const {error:e}=await db.from('church_community_submissions').update({status,reviewed_at:new Date().toISOString()}).eq('id',row.id);if(e)alert(e.message);else render()}approve.onclick=()=>action('approved');reject.onclick=()=>action('rejected');el.append(title,small,body,approve,reject);posts.append(el)}}
login.querySelector('form').onsubmit=async e=>{e.preventDefault();error.textContent='';const f=new FormData(e.target);const {error:err}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(err)error.textContent='로그인 정보가 올바르지 않습니다.';else{if(!await verify()){error.textContent='교회 관리자 권한이 없습니다.';await db.auth.signOut();return}render()}};
document.getElementById('refresh').onclick=render;document.getElementById('logout').onclick=async()=>{await db.auth.signOut();render()};render();
</script></body></html>
