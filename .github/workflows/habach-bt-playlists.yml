name: Sync BT worship and sharing playlists
on:
  workflow_dispatch:
  push:
    branches: [habachnew]
    paths:
      - 'scripts/fetch_bt_playlists.py'
      - 'assets/bt-playlist-gallery.js'
      - 'assets/bt-playlist-videos.json'
      - '.github/workflows/habach-bt-playlists.yml'
  schedule:
    - cron: '24 2 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: habachnew
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yt-dlp
      - run: python scripts/fetch_bt_playlists.py
      - name: Push verified playlist changes
        run: |
          if git diff --quiet -- assets/bt-playlist-videos.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bt-playlist-videos.json
          git commit -m "Refresh verified BT playlist videos"
          git push origin HEAD:habachnew
