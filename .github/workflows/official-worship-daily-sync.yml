name: Daily official worship sync to live website

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST daily
    - cron: '0 13 * * 5' # Friday 22:00 KST
    - cron: '0 12 * * 0' # Sunday 21:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_official_video_albums.py'
      - '.github/workflows/official-worship-daily-sync.yml'

permissions:
  contents: write

concurrency:
  group: official-worship-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website production source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playlist reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Sync completed official videos
        run: python scripts/fetch_official_video_albums.py
      - name: Validate outputs
        run: |
          python -m json.tool assets/official-video-albums.json >/dev/null
          test -s index.html
          git diff --check
      - name: Commit verified changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/official-video-albums.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync completed official worship videos"
            git push origin HEAD:main
          fi
