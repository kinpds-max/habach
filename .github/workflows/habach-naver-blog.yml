name: Sync church Naver blog preview
on:
  schedule:
    - cron: '15 0,6,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync_habach_blog.py
      - name: Commit only changed posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/habach-naver-blog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Naver church blog homepage preview'
            git push origin HEAD:main
          fi
